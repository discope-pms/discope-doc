site_name: Discope PMS
site_url: https://discope.run/
docs_dir: docs
# dev_addr: 127.0.0.1:8000
repo_name: discope
repo_url: https://github.com/discope-pms/discope
edit_uri: ""
theme:
  name: material
  # favicon: '_assets/img/favicon.png'
  # logo: '_assets/img/logo.png'
  feature:
    tabs: true
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
  # 404 page
  static_templates:
    - 404.html
extra_css:
  - '_assets/css/extra.css'
plugins:
  - search
  - mike:
      canonical_version: null
      version_selector: true
      css_dir: css
extra:
  version:
    provider: mike
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
nav:
  - 'Home': 'index.md'
  - 'Concepts':
      - 'Vue d’ensemble': 'concepts/index.md'
      - 'Organisation': 'concepts/organisation.md'
      - 'Centres': 'concepts/centres.md'
      - 'Unités locatives': 'concepts/unites_locatives.md'
  - 'Installation':
      - 'Vue d’ensemble': 'setup/index.md'
      - 'Sécurité': 'setup/securite.md'
      - 'Organisation': 'setup/organisation.md'
      - 'Compta': 'setup/compta.md'
      - 'Communication': 'setup/communication.md'
      - 'Paramètres': 'setup/parametres.md'
      - 'Ventes': 'setup/ventes.md'
      - 'Catalogue des produits': 'setup/catalogue_produits.md'
      - 'Prix': 'setup/prix.md'
      - 'Emails': 'setup/emails.md'
  - 'Descriptif applicatif':
      - 'Introduction': 'fonctionnement/index.md'
      - 'Catalogue':
          - 'Catalogue': 'fonctionnement/catalog.md'
          - 'Tarification': 'fonctionnement/pricing.md'
          - 'Prix, réductions et gratuités': 'fonctionnement/prices-discounts-freebies.md'
          - 'Tours-opérateurs et commissions': 'fonctionnement/travel-agencies.md'
          - 'Agences de voyage en ligne': 'fonctionnement/online-travel-agencies.md'
          - 'Packs': 'fonctionnement/packs.md'
          - 'Saisons': 'fonctionnement/seasons.md'
          - 'Produits automatiques': 'fonctionnement/automatic-products.md'
      - 'Réservations':
          - 'Réservations': 'fonctionnement/bookings.md'
          - 'Contrats': 'fonctionnement/contracts.md'
          - 'Financements': 'fonctionnement/fundings.md'
          - 'Plans de paiement': 'fonctionnement/payment-plans.md'
          - 'Planning et récapitulatifs': 'fonctionnement/planning-and-summaries.md'
      - 'Administration':
          - 'Entités Discope': 'fonctionnement/discope-entities.md'
          - 'Caisse / point de vente': 'fonctionnement/cashdesk-pos.md'
          - 'Rôles et utilisateurs': 'fonctionnement/roles-and-users.md'
          - 'Modèles et e-mails': 'fonctionnement/templates-and-emails.md'
          - 'Traductions': 'fonctionnement/translations.md'
          - 'Comptabilité et facturation': 'fonctionnement/accounting-and-billing.md'
          - 'Statistiques': 'fonctionnement/statistics.md'
          - 'Support': 'fonctionnement/support.md'
