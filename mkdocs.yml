site_name: Discope PMS
site_url: https://discope.run/
docs_dir: docs
# dev_addr: 127.0.0.1:8000
repo_name: discope
repo_url: https://github.com/discope-pms/discope
edit_uri: ""
theme:
  name: material
  # favicon: '_assets/img/favicon.png'
  # logo: '_assets/img/logo.png'
  feature:
    tabs: true
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
  # 404 page
  static_templates:
    - 404.html
extra_css:
  - '_assets/css/extra.css'
plugins:
  - search
  - mike:
      canonical_version: null
      version_selector: true
      css_dir: css
extra:
  version:
    provider: mike
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
nav:
  - 'Home': 'index.md'
  - 'Concepts': 'recapitulatif-des-concepts-manipules.md'
  - 'Installation': 'installations.md'
  - 'Descriptif applicatif':
      - 'Descriptif applicatif': 'descriptif-applicatif/index.md'
      - 'Catalogue': 'descriptif-applicatif/catalogue.md'
      - 'Tarification': 'descriptif-applicatif/tarification.md'
      - 'Prix, Réductions & Gratuités': 'descriptif-applicatif/prix-reductions-gratuitees.md'
      - 'Tours-opérateurs, et Commissions': 'descriptif-applicatif/tours-operateurs.md'
      - 'Online Travel Agencies': 'descriptif-applicatif/online-travel-agencies.md'
      - 'Packs': 'descriptif-applicatif/packs.md'
      - 'Saisons': 'descriptif-applicatif/saisons.md'
      - 'Produits automatiques': 'descriptif-applicatif/produits-automatiques.md'
      - 'Réservations': 'descriptif-applicatif/reservations.md'
      - 'Contrats': 'descriptif-applicatif/contrats.md'
      - 'Financements': 'descriptif-applicatif/financements.md'
      - 'Plans de paiement': 'descriptif-applicatif/plans-de-paiement.md'
      - 'Planning & récapitulatifs': 'descriptif-applicatif/planning-et-recapitulatifs.md'
      - 'Entités Discope': 'descriptif-applicatif/entites-discope.md'
      - 'Caisse / PoS': 'descriptif-applicatif/caisse-pos.md'
      - 'Rôles & Utilisateurs': 'descriptif-applicatif/roles-et-utilisateurs.md'
      - 'Templates & Emails': 'descriptif-applicatif/templates-et-emails.md'
      - 'Traductions': 'descriptif-applicatif/traductions.md'
      - 'Comptabilité & Facturation': 'descriptif-applicatif/comptabilite-et-facturation.md'
      - 'Statistiques': 'descriptif-applicatif/statistiques.md'
      - 'Support': 'descriptif-applicatif/support.md'
