site_name: Discope PMS
site_url: https://discope.run/
docs_dir: docs
# dev_addr: 127.0.0.1:8000
repo_name: discope
repo_url: https://github.com/discope-pms/discope
edit_uri: ""
theme:
  name: material
  # favicon: '_assets/img/favicon.png'
  # logo: '_assets/img/logo.png'
  feature:
    tabs: true
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
  # 404 page
  static_templates:
    - 404.html
extra_css:
  - '_assets/css/extra.css'
plugins:
  - search
  - mike:
      canonical_version: null
      version_selector: true
      css_dir: css
extra:
  version:
    provider: mike
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
nav:
  - 'Home': 'index.md'
  - 'Concepts': 'concepts.md'
  - 'Installation': 'setup.md'
  - 'Descriptif applicatif':
      - 'Descriptif applicatif': 'application-description/index.md'
      - 'Catalogue': 'application-description/catalog.md'
      - 'Tarification': 'application-description/pricing.md'
      - 'Prix, Réductions & Gratuités': 'application-description/prices-discounts-freebies.md'
      - 'Tours-opérateurs, et Commissions': 'application-description/travel-agencies.md'
      - 'Online Travel Agencies': 'application-description/online-travel-agencies.md'
      - 'Packs': 'application-description/packs.md'
      - 'Saisons': 'application-description/seasons.md'
      - 'Produits automatiques': 'application-description/automatic-products.md'
      - 'Réservations': 'application-description/bookings.md'
      - 'Contrats': 'application-description/contracts.md'
      - 'Financements': 'application-description/fundings.md'
      - 'Plans de paiement': 'application-description/payment-plans.md'
      - 'Planning & récapitulatifs': 'application-description/planning-and-summaries.md'
      - 'Entités Discope': 'application-description/discope-entities.md'
      - 'Caisse / PoS': 'application-description/cashdesk-pos.md'
      - 'Rôles & Utilisateurs': 'application-description/roles-and-users.md'
      - 'Templates & Emails': 'application-description/templates-and-emails.md'
      - 'Traductions': 'application-description/translations.md'
      - 'Comptabilité & Facturation': 'application-description/accounting-and-billing.md'
      - 'Statistiques': 'application-description/statistics.md'
      - 'Support': 'application-description/support.md'
